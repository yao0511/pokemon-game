# Render.com 部署設定（單一服務：後端同時提供前端靜態檔 + API + WebSocket）
services:
  - type: web
    name: pokemon-battle
    runtime: node
    plan: free
    # 走根目錄 package.json 的 scripts（build 會裝前後端依賴並 build 前端）
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Render 會自動注入 PORT 環境變數，後端會讀取它（本機才 fallback 3001）
    healthCheckPath: /api/health
